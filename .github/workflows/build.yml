name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
concurrency:
  group: fotoporyadok-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare release signing key
        env:
          FOTOPORYADOK_SIGNING_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FOTOPORYADOK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Add the FOTOPORYADOK_SIGNING_PASSWORD repository secret before building the signed release."
            exit 1
          fi
          base64 --decode signing/release-key.jks.enc.b64 > "$RUNNER_TEMP/release-key.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/release-key.jks.enc" \
            -out "$RUNNER_TEMP/fotoporyadok-release.jks" \
            -pass env:FOTOPORYADOK_SIGNING_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/fotoporyadok-release.jks" \
            -storepass:env FOTOPORYADOK_SIGNING_PASSWORD -alias fotoporyadok >/dev/null
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fotoporyadok-release.jks"
            echo "KEYSTORE_PASSWORD=$FOTOPORYADOK_SIGNING_PASSWORD"
            echo "KEY_ALIAS=fotoporyadok"
            echo "KEY_PASSWORD=$FOTOPORYADOK_SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing key decrypted and verified."
      - name: Bundle the ten CC0 theme photographs into the APK
        run: |
          set -euo pipefail
          resource_dir="app/src/main/res/drawable-nodpi"
          mkdir -p "$resource_dir"
          urls=(
            'https://c.pxhere.com/photos/18/5e/teton_mountains_wyoming_trees_forest_woods_river_water-1119978.jpg!d'
            'https://c.pxhere.com/photos/59/e8/beach_clouds_conifer_daylight_docks_foliage_forest_island-1068766.jpg!d'
            'https://c.pxhere.com/photos/54/6b/trees_sky_mountain_clouds_forest_landscape_outdoor_turquoise-106152.jpg!d'
            'https://c.pxhere.com/photos/00/cb/lake_forest_mountain_foggy_landscape_nature_water_evergreens-595654.jpg!d'
            'https://c.pxhere.com/photos/6b/5a/lake_reflection_mountains_landscape_calm_nature_water_peaceful-676105.jpg!d'
            'https://c.pxhere.com/photos/5f/66/mountain_sky_clouds_outdoors_tranquil_high_weather_meteorology-1015434.jpg!d'
            'https://c.pxhere.com/photos/d4/19/palm_trees_tropical_houses_sky_clouds_city_town_sunset-892422.jpg!d'
            'https://c.pxhere.com/photos/45/0c/mountains_sea_water_buildings_city_vacation_europe_travel-654439.jpg!d'
            'https://c.pxhere.com/photos/a4/fc/photo-111696.jpg!d'
            'https://c.pxhere.com/photos/b0/82/beach_black_and_white_boat_bridge_dawn_dock_dusk_evening-1130756.jpg!d'
          )
          for index in "${!urls[@]}"; do
            number=$(printf '%02d' "$((index + 1))")
            rm -f "$resource_dir/theme_wallpaper_${number}.xml"
            curl --fail --location --retry 3 --retry-delay 2 "${urls[$index]}" \
              --output "$resource_dir/theme_wallpaper_${number}.jpg"
            test -s "$resource_dir/theme_wallpaper_${number}.jpg"
            file "$resource_dir/theme_wallpaper_${number}.jpg"
          done
      - name: Build debug and signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
          KEY_ALIAS: fotoporyadok
          KEY_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fotoporyadok-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fotoporyadok-release-apk
          path: app/build/outputs/apk/release/*.apk

      - name: Publish signed APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping release: a newer main commit exists."
            exit 0
          fi
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Could not read app version from app/build.gradle.kts"
            exit 1
          fi
          tag="v$version_name"
          cp app/build/outputs/apk/release/app-release.apk app-release.apk
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$tag" app-release.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ФотоПорядок $version_name" \
              --notes "versionCode: $version_code"
          fi
