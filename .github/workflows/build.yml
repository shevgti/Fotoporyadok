name: Build APK
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fotoporyadok-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android-ui-tests:
    name: Back navigation on Android 16 emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Bundle theme photographs required by the app resources
        run: bash scripts/download-theme-images.sh
      - name: Run instrumented tests on Android 16 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb shell settings put secure navigation_mode 2
            gradle connectedDebugAndroidTest --stacktrace
      - name: Upload Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-test-reports-api-36
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
  build:
    needs: android-ui-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Prepare release signing key
        env:
          FOTOPORYADOK_SIGNING_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${FOTOPORYADOK_SIGNING_PASSWORD:-}" ]; then
            echo "::error::Add the FOTOPORYADOK_SIGNING_PASSWORD repository secret before building the signed release."
            exit 1
          fi
          base64 --decode signing/release-key.jks.enc.b64 > "$RUNNER_TEMP/release-key.jks.enc"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 \
            -in "$RUNNER_TEMP/release-key.jks.enc" \
            -out "$RUNNER_TEMP/fotoporyadok-release.jks" \
            -pass env:FOTOPORYADOK_SIGNING_PASSWORD
          keytool -list -keystore "$RUNNER_TEMP/fotoporyadok-release.jks" \
            -storepass:env FOTOPORYADOK_SIGNING_PASSWORD -alias fotoporyadok >/dev/null
          {
            echo "KEYSTORE_FILE=$RUNNER_TEMP/fotoporyadok-release.jks"
            echo "KEYSTORE_PASSWORD=$FOTOPORYADOK_SIGNING_PASSWORD"
            echo "KEY_ALIAS=fotoporyadok"
            echo "KEY_PASSWORD=$FOTOPORYADOK_SIGNING_PASSWORD"
          } >> "$GITHUB_ENV"
          echo "Release signing key decrypted and verified."
      - name: Bundle the ten CC0 theme photographs into the APK
        run: bash scripts/download-theme-images.sh
      - name: Build debug and signed release APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
          KEY_ALIAS: fotoporyadok
          KEY_PASSWORD: ${{ secrets.FOTOPORYADOK_SIGNING_PASSWORD }}
        run: gradle assembleDebug assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Fotoporyadok-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Fotoporyadok-release-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publish signed APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          latest_sha="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$latest_sha" != "$GITHUB_SHA" ]; then
            echo "Skipping release: a newer main commit exists."
            exit 0
          fi
          version_name="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n1)"
          version_code="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n1)"
          if [ -z "$version_name" ] || [ -z "$version_code" ]; then
            echo "::error::Could not read app version from app/build.gradle.kts"
            exit 1
          fi
          tag="v$version_name"
          cp app/build/outputs/apk/release/app-release.apk app-release.apk
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "$tag" app-release.apk --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "$tag" app-release.apk \
              --repo "${GITHUB_REPOSITORY}" \
              --title "ФотоПорядок $version_name" \
              --notes "versionCode: $version_code"
          fi
